<!doctype html><meta charset="utf-8"><title>涿郡募兵 · 路线规划（空白画布）</title>
<style>body{margin:0;background:#f4efe3;font:15px/1.6 -apple-system,"PingFang SC",sans-serif}main{max-width:1300px;margin:auto;padding:16px}
canvas{width:100%;border-radius:6px;display:block}table{border-collapse:collapse;width:100%;margin-top:12px;font-size:14px}th,td{border:1px solid #d8ccb2;padding:5px 8px;text-align:left}th{background:#ebe0c8}
h2{margin:6px 0 8px}.k{display:inline-block;width:26px;height:26px;border-radius:50%;color:#fff;text-align:center;font-weight:bold;line-height:26px}</style>
<main><h2>涿郡募兵 · 路线与关键点位规划（空白画布手绘）</h2><canvas id="c" width="2000" height="1000"></canvas><table id="t"></table></main>
<script>
// 坐标用 1000×500（和地形图缩略图一致），画到 2000×1000
const K=2;
const ROUTES={
 北路:{c:'#e53935',road:[2,10],p:[[175,228],[245,200],[300,165],[338,108],[372,70],[398,48],[432,82],[468,108],[515,116],[620,120],[760,152],[848,202]],note:'上坡到山顶黄巾兵营 C4（北路唯一的敌营），再下坡过北桥，路一直通到黄巾大营门前；上坡移速 -25%'},
 中路:{c:'#1e88e5',road:[2,6],p:[[175,240],[262,252],[322,282],[470,306],[545,300],[650,282],[782,242],[850,218]],note:'最短；沿村庄南边；中桥窄，会挤'},
 南路:{c:'#f9a825',road:[1,7],p:[[172,252],[212,318],[300,382],[420,394],[516,396],[620,402],[740,388],[832,334],[866,236]],note:'穿两片树林，浅滩涉水；最慢；树林里远程易打偏'},
};
// 关键点位：[编号, 名称, x, y, 类型, 说明]
const PTS=[
 ['A','汉军主城',130,235,'base','左边夯土空地中央'],
 ['B1','汉军兵营·北',300,165,'camp','北路起点'],
 ['B2','汉军兵营·中',322,282,'camp','中路起点'],
 ['B3','汉军兵营·南',212,318,'camp','南路起点'],
 ['C4','黄巾兵营·山包',398,48,'ecamp','小山包顶的空地（高地），北路必经；高地上的弓兵射程更远'],
 ['E3','黄巾箭塔·山包',340,52,'etower','山顶西侧，高地射程 +30%，压制北路上坡的汉军'],
 ['G1','汉军门牙塔·上',198,205,'tower','大本营正面，两座门牙塔之一'],
 ['G2','汉军门牙塔·下',198,268,'tower','大本营正面，两座门牙塔之一'],
 ['T1','汉军箭塔·北',330,122,'tower','B1 前方，保护北路兵营'],
 ['T2','汉军箭塔·中',395,304,'tower','B2 前方，保护中路兵营'],
 ['T3','汉军箭塔·南',252,360,'tower','B3 前方，保护南路兵营'],
 ['Q1','北桥（宽）',515,116,'bridge','北路过河；宽，可 3 人并排'],
 ['Q2','中桥（窄）',545,300,'bridge','中路过河；窄，只能 2 人并排'],
 ['F','浅滩',516,396,'ford','南路涉水；移速 -50%，骑兵 -60%'],
 ['C2','黄巾兵营·中',782,242,'ecamp','中桥东岸'],
 ['C3','黄巾兵营·南',832,334,'ecamp','南边树林出口'],
 ['E1','黄巾箭塔·北桥',612,128,'etower','守北桥东头'],
 ['E2','黄巾箭塔·中桥',640,296,'etower','守中桥东头'],
 ['E4','黄巾箭塔·南',735,385,'etower','C3 前方，守南路树林出口'],
 ['H1','黄巾门牙塔·上',842,190,'etower','大本营正面，两座门牙塔之一'],
 ['H2','黄巾门牙塔·下',842,246,'etower','大本营正面，两座门牙塔之一'],
 ['E','黄巾大营',895,215,'ebase','右边夯土空地中央，背靠山'],
];
function fordDraw(g,X,Y,ref){// 浅滩：河道在这里变宽变浅，水色发白，露出卵石；不规则的形状，顺着河道
 let seed=13;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
 g.beginPath();const n=16;for(let i=0;i<=n;i++){const a=i/n*Math.PI*2,rx=27*(0.8+rnd()*0.4),ry=36*(0.8+rnd()*0.4),x=X+Math.cos(a)*rx,y=Y+Math.sin(a)*ry;i?g.lineTo(x,y):g.moveTo(x,y)}g.closePath();
 g.fillStyle=ref?'#bfe0ef':'#cfe9f5';g.fill();
 for(let i=0;i<16;i++){const a=rnd()*7,d=Math.sqrt(rnd()),x=X+Math.cos(a)*21*d,y=Y+Math.sin(a)*30*d,r=2+rnd()*3;g.beginPath();g.ellipse(x,y,r,r*0.7,rnd()*3,0,7);g.fillStyle=['#a89f8f','#8f8778','#c2b9a6'][i%3];g.fill()}
 // 涉水的水花：几道白色短波纹
 g.strokeStyle='#ffffffcc';g.lineWidth=3;for(let i=0;i<3;i++){const y=Y-20+i*20,x=X-12+rnd()*8;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+8,y-4,x+16,y);g.stroke()}}
const COL={base:'#1e5bd6',camp:'#3d6fd6',tower:'#3d6fd6',bridge:'#6d4c2f',ford:'#2aa1c9',ecamp:'#d9a400',etower:'#d9a400',merge:'#8e24aa',ebase:'#c78a00'};
function curve(g,p){g.beginPath();g.moveTo(...p[0]);for(let i=0;i<p.length-1;i++){const p0=p[Math.max(0,i-1)],p1=p[i],p2=p[i+1],p3=p[Math.min(p.length-1,i+2)];
 g.bezierCurveTo(p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6,p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6,p2[0],p2[1])}}
(()=>{const g=document.getElementById('c').getContext('2d');
 // 空白画布：米色纸面 + 浅网格
 g.fillStyle='#f7f1e3';g.fillRect(0,0,2000,1000);g.strokeStyle='#e6dcc6';g.lineWidth=1;
 for(let x=0;x<=2000;x+=100){g.beginPath();g.moveTo(x,0);g.lineTo(x,1000);g.stroke()}for(let y=0;y<=1000;y+=100){g.beginPath();g.moveTo(0,y);g.lineTo(2000,y);g.stroke()}
 const zone=(pts,fill,stroke,dash,label)=>{g.beginPath();pts.forEach(([x,y],i)=>i?g.lineTo(x*K,y*K):g.moveTo(x*K,y*K));g.closePath();g.fillStyle=fill;g.fill();g.setLineDash(dash||[]);g.strokeStyle=stroke;g.lineWidth=4;g.stroke();g.setLineDash([]);
  if(label){const lx=Math.min(...pts.map(p=>p[0]))*K+14,ly=Math.min(...pts.map(p=>p[1]))*K+38;g.font='bold 28px PingFang SC';g.fillStyle=stroke;g.fillText(label,lx,ly)}};
 // 地形线框（只表示范围）
 zone([[0,140],[280,140],[285,330],[0,335]],'#eadcbcaa','#a98a52',[12,8],'汉军营地');
 zone([[800,150],[1000,140],[1000,300],[805,300]],'#eadcbcaa','#a98a52',[12,8],'黄巾营地');
 zone([[300,30],[440,25],[460,108],[300,112]],'#d9c59a','#8a6d3b',null,'小山包（高地）');
 zone([[330,170],[480,165],[485,282],[335,286]],'#e8d3b0','#9a6b3e',null,'村庄');
 zone([[150,330],[470,320],[470,490],[160,490]],'#cfe0bf','#4f7a3e',null,'树林（远程易打偏）');
 zone([[540,300],[880,295],[880,480],[540,480]],'#cfe0bf','#4f7a3e',null,'树林');
 zone([[850,0],[1000,0],[1000,130],[880,120]],'#d9c59a','#8a6d3b',null,'山');
 // 河：一条竖着的弯曲带子
 g.beginPath();[[480,0],[530,70],[505,140],[560,220],[545,300],[520,380],[505,440],[500,500]].forEach(([x,y],i)=>i?g.lineTo(x*K,y*K):g.moveTo(x*K,y*K));
 g.strokeStyle='#9cc7e8';g.lineWidth=46;g.lineCap='round';g.lineJoin='round';g.stroke();g.strokeStyle='#5a9fd1';g.lineWidth=4;g.setLineDash([16,10]);g.stroke();g.setLineDash([]);
 g.font='28px PingFang SC';g.fillStyle='#2f6fa3';g.fillText('小河（只能走桥和浅滩过）',1110,50);
 fordDraw(g,516*K,396*K,false);
 const g2=g;
 for(const[n,r]of Object.entries(ROUTES)){const P=r.p.map(([x,y])=>[x*K,y*K]);
  // 进攻路线全程（细虚线，不是路）
  curve(g,P);g.setLineDash([14,12]);g.strokeStyle=r.c;g.lineWidth=5;g.lineCap='round';g.stroke();g.setLineDash([]);
  // 路只画兵营到敌方兵营这一段
  const p=P.slice(r.road[0],r.road[1]+1);
  curve(g,p);g.strokeStyle='#fff';g.lineWidth=34;g.lineCap='round';g.lineJoin='round';g.stroke();
  curve(g,p);g.strokeStyle=r.c;g.lineWidth=n==='坡道'?14:24;g.stroke();if(n==='南路'){g.save();g.beginPath();g.ellipse(516*K,396*K,21,30,0,0,7);g.clip();fordDraw(g,516*K,396*K,false);g.globalAlpha=0.45;curve(g,p);g.strokeStyle=r.c;g.lineWidth=24;g.stroke();g.restore()}
  curve(g,p);g.setLineDash([30,22]);g.strokeStyle='#ffffffaa';g.lineWidth=6;g.stroke();g.setLineDash([]);
  // 方向箭头
  for(let i=1;i<p.length;i+=2){const a=Math.atan2(p[i][1]-p[i-1][1],p[i][0]-p[i-1][0]);g.save();g.translate((p[i][0]+p[i-1][0])/2,(p[i][1]+p[i-1][1])/2);g.rotate(a);
   g.fillStyle='#fff';g.beginPath();g.moveTo(16,0);g.lineTo(-12,-13);g.lineTo(-12,13);g.fill();g.restore()}
  const q=p[2];g.font='bold 40px PingFang SC';g.lineWidth=8;g.strokeStyle='#fff';g.strokeText(n,q[0]-40,q[1]-28);g.fillStyle=r.c;g.fillText(n,q[0]-40,q[1]-28);}
 for(const[id,name,x,y,t]of PTS){const X=x*K,Y=y*K,c=COL[t];g.beginPath();
  if(t==='bridge'){g.save();g.translate(X,Y);g.fillStyle='#000';g.fillRect(-34,-20,68,40);g.fillStyle=c;g.fillRect(-30,-16,60,32);g.restore()}
  else if(t==='ford'){}
  else if(t.includes('tower')){g.beginPath();g.moveTo(X,Y-30);g.lineTo(X+26,Y+18);g.lineTo(X-26,Y+18);g.closePath();g.fillStyle='#fff';g.fill();g.beginPath();g.moveTo(X,Y-22);g.lineTo(X+19,Y+13);g.lineTo(X-19,Y+13);g.closePath();g.fillStyle=c;g.fill()}
  else if(t.includes('base')){g.fillStyle='#fff';g.fillRect(X-42,Y-42,84,84);g.fillStyle=c;g.fillRect(X-36,Y-36,72,72)}
  else{g.beginPath();g.arc(X,Y,t==='merge'?20:26,0,7);g.fillStyle='#fff';g.fill();g.beginPath();g.arc(X,Y,t==='merge'?14:20,0,7);g.fillStyle=c;g.fill()}
  g.font='bold 30px PingFang SC';g.lineWidth=7;g.strokeStyle='#000';const tx=X+30,ty=Y+(t==='bridge'||t==='ford'?52:10);g.strokeText(id,tx,ty);g.fillStyle='#fff';g.fillText(id,tx,ty);}
 const tb=document.getElementById('t');tb.innerHTML='<tr><th>编号</th><th>点位</th><th>说明</th></tr>'+PTS.map(([id,n,x,y,t,d])=>`<tr><td><b>${id}</b></td><td>${n}</td><td>${d}</td></tr>`).join('')
  +'<tr><th colspan=3>路线</th></tr>'+Object.entries(ROUTES).map(([n,r])=>`<tr><td><span class=k style="background:${r.c}">　</span></td><td>${n}</td><td>${r.note}</td></tr>`).join('');})();
</script>
