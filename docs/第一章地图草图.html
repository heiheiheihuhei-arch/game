<h1>第一章 黄巾之乱 · 地图布局（第二版）</h1>
<div class="note">不再是三条平行的直路：路顺着地形走，会拐弯、分叉、汇合，路的条数和兵营位置按这场仗来定，两边不对称。这仍是<b>布局示意</b>，最终美术由 AI 照着这个构图来画。蓝 = 汉军，黄 = 黄巾。</div>

<script>
const W=1800,H=900;
// 固定种子随机数
function rng(seed){return()=> (seed=(seed*16807)%2147483647)/2147483647}
// 平滑闭合不规则形状
function blob(g,cx,cy,rx,ry,seed,wob=0.25){const r=rng(seed);const n=14,pts=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2,k=1+(r()-0.5)*wob*2;pts.push([cx+Math.cos(a)*rx*k,cy+Math.sin(a)*ry*k])}
 g.beginPath();for(let i=0;i<=n;i++){const p=pts[i%n],q=pts[(i+1)%n],m=[(p[0]+q[0])/2,(p[1]+q[1])/2];i?g.quadraticCurveTo(p[0],p[1],m[0],m[1]):g.moveTo(m[0],m[1])}g.closePath()}
// Catmull-Rom 平滑曲线
function curve(g,pts){g.beginPath();g.moveTo(...pts[0]);for(let i=0;i<pts.length-1;i++){const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
 g.bezierCurveTo(p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6,p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6,p2[0],p2[1])}}
function grain(g,seed,col,n,sz){const r=rng(seed);g.fillStyle=col;for(let i=0;i<n;i++){g.globalAlpha=0.08+r()*0.12;g.beginPath();g.arc(r()*W,r()*H,sz*(0.4+r()),0,7);g.fill()}g.globalAlpha=1}
function trees(g,cx,cy,rx,ry,seed,n){const r=rng(seed);for(let i=0;i<n;i++){const a=r()*7,d=Math.sqrt(r());const x=cx+Math.cos(a)*rx*d,y=cy+Math.sin(a)*ry*d,s=12+r()*10;
 g.fillStyle='#1f4a22';g.beginPath();g.arc(x+3,y+4,s,0,7);g.fill();g.fillStyle=['#2f6b33','#3b7d3a','#2a5f2e'][i%3];g.beginPath();g.arc(x,y,s,0,7);g.fill()}}
function hill(g,cx,cy,rx,ry,seed){for(let k=0;k<4;k++){blob(g,cx,cy-k*8,rx*(1-k*0.2),ry*(1-k*0.2),seed+k,0.2);g.fillStyle=['#b39864','#c3a872','#d0b680','#dcc48f'][k];g.fill();g.strokeStyle='#8a734880';g.lineWidth=2;g.stroke()}}
function river(g,pts,w){curve(g,pts);g.strokeStyle='#4f7fae';g.lineWidth=w+10;g.lineCap='round';g.stroke();curve(g,pts);g.strokeStyle='#6fa6d8';g.lineWidth=w;g.stroke();curve(g,pts);g.strokeStyle='#a9d0ef80';g.lineWidth=w*0.3;g.stroke()}
function road(g,pts){curve(g,pts);g.strokeStyle='#9c7a46';g.lineWidth=44;g.lineCap='round';g.lineJoin='round';g.stroke();curve(g,pts);g.strokeStyle='#d8bd84';g.lineWidth=34;g.stroke();curve(g,pts);g.strokeStyle='#e6d19f90';g.lineWidth=10;g.stroke()}
function bridge(g,x,y,ang){g.save();g.translate(x,y);g.rotate(ang);g.fillStyle='#6e4f2c';g.fillRect(-40,-24,80,48);g.fillStyle='#93703f';for(let i=-36;i<40;i+=10)g.fillRect(i,-22,7,44);g.restore()}
function wallRing(g,cx,cy,rx,ry,gates){g.save();g.beginPath();g.ellipse(cx,cy,rx,ry,0,0,7);g.strokeStyle='#5d5a55';g.lineWidth=26;g.stroke();g.strokeStyle='#9a958c';g.lineWidth=18;g.stroke();
 for(const a of gates){const x=cx+Math.cos(a)*rx,y=cy+Math.sin(a)*ry;g.fillStyle='#6b4a2a';g.fillRect(x-16,y-16,32,32);g.strokeStyle='#222';g.lineWidth=2;g.strokeRect(x-16,y-16,32,32)}g.restore()}
function palisade(g,pts){curve(g,pts);g.setLineDash([8,6]);g.strokeStyle='#6b4a2a';g.lineWidth=12;g.stroke();g.setLineDash([])}
function village(g,x,y,seed){const r=rng(seed);for(let i=0;i<6;i++){const hx=x+(r()-0.5)*110,hy=y+(r()-0.5)*70;g.fillStyle='#8c5a3a';g.fillRect(hx-14,hy-10,28,20);g.fillStyle='#b8874f';g.beginPath();g.moveTo(hx-17,hy-10);g.lineTo(hx,hy-22);g.lineTo(hx+17,hy-10);g.fill()}}
function field(g,x,y,w,h,ang,seed){g.save();g.translate(x,y);g.rotate(ang);g.fillStyle='#b9c46a';g.fillRect(-w/2,-h/2,w,h);g.strokeStyle='#8f9c4a';g.lineWidth=2;for(let i=-w/2;i<w/2;i+=12){g.beginPath();g.moveTo(i,-h/2);g.lineTo(i,h/2);g.stroke()}g.restore()}
function marsh(g,cx,cy,rx,ry,seed){blob(g,cx,cy,rx,ry,seed,0.3);g.fillStyle='#6f8f6a';g.fill();const r=rng(seed+9);for(let i=0;i<18;i++){g.fillStyle='#5f8fb8a0';blob(g,cx+(r()-0.5)*rx*1.4,cy+(r()-0.5)*ry*1.4,14+r()*18,8+r()*10,seed+i,0.3);g.fill()}}
function tallgrass(g,cx,cy,rx,ry,seed){blob(g,cx,cy,rx,ry,seed,0.3);g.fillStyle='#a8b45a';g.fill();const r=rng(seed);g.strokeStyle='#7f8a38';g.lineWidth=2;for(let i=0;i<120;i++){const a=r()*7,d=Math.sqrt(r()),x=cx+Math.cos(a)*rx*d*0.9,y=cy+Math.sin(a)*ry*d*0.9;g.beginPath();g.moveTo(x,y);g.lineTo(x-3,y-10);g.moveTo(x,y);g.lineTo(x+3,y-9);g.stroke()}}
function camp(g,x,y,side){const c=side==='me'?'#3d6fd6':'#e0b020';g.fillStyle='#0004';g.beginPath();g.ellipse(x,y+14,26,9,0,0,7);g.fill();g.fillStyle=c;g.beginPath();g.moveTo(x-24,y+12);g.lineTo(x,y-20);g.lineTo(x+24,y+12);g.fill();g.strokeStyle='#222';g.lineWidth=2;g.stroke();g.fillStyle='#222';g.fillRect(x-1,y-34,2,16);g.fillStyle=c;g.fillRect(x+1,y-34,14,9)}
function tower(g,x,y,side){const c=side==='me'?'#3d6fd6':'#e0b020';g.fillStyle='#0004';g.beginPath();g.ellipse(x,y+12,15,6,0,0,7);g.fill();g.fillStyle='#7b5a34';g.fillRect(x-9,y-14,18,26);g.fillStyle=c;g.beginPath();g.moveTo(x-14,y-14);g.lineTo(x,y-28);g.lineTo(x+14,y-14);g.fill();g.strokeStyle='#222';g.lineWidth=2;g.stroke()}
function keep(g,x,y,side,big){const c=side==='me'?'#3d6fd6':'#e0b020',s=big?1.3:1;g.fillStyle='#0005';g.beginPath();g.ellipse(x,y+26*s,56*s,16*s,0,0,7);g.fill();g.fillStyle='#c9a66b';g.fillRect(x-48*s,y-14*s,96*s,40*s);g.strokeStyle='#222';g.lineWidth=2;g.strokeRect(x-48*s,y-14*s,96*s,40*s);
 g.fillStyle=c;g.beginPath();g.moveTo(x-40*s,y-14*s);g.lineTo(x,y-40*s);g.lineTo(x+40*s,y-14*s);g.fill();g.stroke()}
function target(g,x,y){g.strokeStyle='#d22';g.lineWidth=4;g.setLineDash([7,5]);g.beginPath();g.arc(x,y,40,0,7);g.stroke();g.setLineDash([])}
function label(g,x,y,t){g.font='bold 26px PingFang SC';g.lineWidth=6;g.strokeStyle='#fff8';g.strokeText(t,x,y);g.fillStyle='#4a2a10';g.fillText(t,x,y)}
function arrow(g,x,y,dx,dy){g.save();g.strokeStyle='#ffffffc0';g.fillStyle='#ffffffc0';g.lineWidth=6;g.beginPath();g.moveTo(x,y);g.lineTo(x+dx,y+dy);g.stroke();const a=Math.atan2(dy,dx);g.translate(x+dx,y+dy);g.rotate(a);g.beginPath();g.moveTo(0,0);g.lineTo(-18,-10);g.lineTo(-18,10);g.fill();g.restore()}
